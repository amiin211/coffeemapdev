<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1318 212' font-family='Inter, Roboto, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Blue Nile Flood Risk: the in-browser pipeline'>
<rect width='1318' height='212' rx='16' fill='#FBF7F2'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#1F6FB2'/></marker></defs>
<text x='24' y='36' font-size='17' font-weight='800' fill='#2B1D14'>Blue Nile Flood Risk: the in-browser pipeline</text>
<rect x='24' y='56' width='190' height='128' rx='12' fill='#FFFFFF' stroke='#CDBFAF' stroke-width='1.4'/>
<circle cx='48' cy='82' r='13' fill='#1F6FB2'/><text x='48' y='87' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>1</text>
<text x='70' y='87' font-size='16' font-weight='800' fill='#2B1D14'>Fetch</text>
<text x='40' y='118' font-size='13' fill='#5B4A3D'>Sentinel-1 on 2 dates,</text>
<text x='40' y='137' font-size='13' fill='#5B4A3D'>terrain tiles, rainfall,</text>
<text x='40' y='156' font-size='13' fill='#5B4A3D'>OSM rivers</text>
<path d='M217 120.0 H237' stroke='#1F6FB2' stroke-width='2' marker-end='url(#a)'/>
<rect x='240' y='56' width='190' height='128' rx='12' fill='#FFFFFF' stroke='#CDBFAF' stroke-width='1.4'/>
<circle cx='264' cy='82' r='13' fill='#1F6FB2'/><text x='264' y='87' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>2</text>
<text x='286' y='87' font-size='16' font-weight='800' fill='#2B1D14'>Decode</text>
<text x='256' y='118' font-size='13' fill='#5B4A3D'>every tile onto one</text>
<text x='256' y='137' font-size='13' fill='#5B4A3D'>Web Mercator grid,</text>
<text x='256' y='156' font-size='13' fill='#5B4A3D'>no reprojection</text>
<path d='M433 120.0 H453' stroke='#1F6FB2' stroke-width='2' marker-end='url(#a)'/>
<rect x='456' y='56' width='190' height='128' rx='12' fill='#FFFFFF' stroke='#CDBFAF' stroke-width='1.4'/>
<circle cx='480' cy='82' r='13' fill='#1F6FB2'/><text x='480' y='87' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>3</text>
<text x='502' y='87' font-size='16' font-weight='800' fill='#2B1D14'>Derive</text>
<text x='472' y='118' font-size='13' fill='#5B4A3D'>slope, distance to river,</text>
<text x='472' y='137' font-size='13' fill='#5B4A3D'>height above river</text>
<text x='472' y='156' font-size='13' fill='#5B4A3D'>(distance transform)</text>
<path d='M649 120.0 H669' stroke='#1F6FB2' stroke-width='2' marker-end='url(#a)'/>
<rect x='672' y='56' width='190' height='128' rx='12' fill='#FFFFFF' stroke='#CDBFAF' stroke-width='1.4'/>
<circle cx='696' cy='82' r='13' fill='#1F6FB2'/><text x='696' y='87' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>4</text>
<text x='718' y='87' font-size='16' font-weight='800' fill='#2B1D14'>Detect</text>
<text x='688' y='118' font-size='13' fill='#5B4A3D'>water on both dates;</text>
<text x='688' y='137' font-size='13' fill='#5B4A3D'>new flood vs</text>
<text x='688' y='156' font-size='13' fill='#5B4A3D'>permanent water</text>
<path d='M865 120.0 H885' stroke='#1F6FB2' stroke-width='2' marker-end='url(#a)'/>
<rect x='888' y='56' width='190' height='128' rx='12' fill='#FFFFFF' stroke='#CDBFAF' stroke-width='1.4'/>
<circle cx='912' cy='82' r='13' fill='#1F6FB2'/><text x='912' y='87' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>5</text>
<text x='934' y='87' font-size='16' font-weight='800' fill='#2B1D14'>Score</text>
<text x='904' y='118' font-size='13' fill='#5B4A3D'>transparent weighted</text>
<text x='904' y='137' font-size='13' fill='#5B4A3D'>risk model, 0–1,</text>
<text x='904' y='156' font-size='13' fill='#5B4A3D'>four classes</text>
<path d='M1081 120.0 H1101' stroke='#1F6FB2' stroke-width='2' marker-end='url(#a)'/>
<rect x='1104' y='56' width='190' height='128' rx='12' fill='#FFFFFF' stroke='#CDBFAF' stroke-width='1.4'/>
<circle cx='1128' cy='82' r='13' fill='#1F6FB2'/><text x='1128' y='87' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>6</text>
<text x='1150' y='87' font-size='16' font-weight='800' fill='#2B1D14'>Paint</text>
<text x='1120' y='118' font-size='13' fill='#5B4A3D'>canvas overlay on the</text>
<text x='1120' y='137' font-size='13' fill='#5B4A3D'>map; sliders recompute</text>
<text x='1120' y='156' font-size='13' fill='#5B4A3D'>instantly</text>
</svg>