<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 470' font-family='Inter, Roboto, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' role='img' aria-label='Al Jouf crop monitoring: offline Python pipeline and static browser WebGIS'>
<rect width='1180' height='470' rx='16' fill='#FBF7F2'/>
<defs><marker id='g' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#2E7D4F'/></marker><marker id='b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#1F6FB2'/></marker></defs>
<rect x='20' y='20' width='600' height='430' rx='14' fill='#FFFFFF' stroke='#2E7D4F' stroke-width='1.8'/>
<text x='40' y='52' font-size='17' font-weight='800' fill='#2E7D4F'>OFFLINE · PYTHON PIPELINE</text>
<text x='40' y='74' font-size='13' fill='#5B4A3D'>Run occasionally on a laptop; resumes from its cache</text>
<rect x='40' y='92' width='560' height='40' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='56' y='118' font-size='14.5' font-weight='800' fill='#2B1D14'>pystac-client</text><text x='210' y='118' font-size='13.5' fill='#5B4A3D'>find Sentinel-2 L2A scenes (Planetary Computer)</text>
<path d='M320 132 V142' stroke='#2E7D4F' stroke-width='2' marker-end='url(#g)'/>
<rect x='40' y='144' width='560' height='40' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='56' y='170' font-size='14.5' font-weight='800' fill='#2B1D14'>Rasterio</text><text x='210' y='170' font-size='13.5' fill='#5B4A3D'>read only the Al Jouf window of each band</text>
<path d='M320 184 V194' stroke='#2E7D4F' stroke-width='2' marker-end='url(#g)'/>
<rect x='40' y='196' width='560' height='40' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='56' y='222' font-size='14.5' font-weight='800' fill='#2B1D14'>NumPy</text><text x='210' y='222' font-size='13.5' fill='#5B4A3D'>NDVI, EVI, SCL cloud mask, max-NDVI composite</text>
<path d='M320 236 V246' stroke='#2E7D4F' stroke-width='2' marker-end='url(#g)'/>
<rect x='40' y='248' width='560' height='40' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='56' y='274' font-size='14.5' font-weight='800' fill='#2B1D14'>OpenCV</text><text x='210' y='274' font-size='13.5' fill='#5B4A3D'>Hough circles → pivots; contours → block fields</text>
<path d='M320 288 V298' stroke='#2E7D4F' stroke-width='2' marker-end='url(#g)'/>
<rect x='40' y='300' width='560' height='40' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='56' y='326' font-size='14.5' font-weight='800' fill='#2B1D14'>Shapely + pyproj</text><text x='210' y='326' font-size='13.5' fill='#5B4A3D'>polygons, areas, WGS 84</text>
<path d='M320 340 V350' stroke='#2E7D4F' stroke-width='2' marker-end='url(#g)'/>
<rect x='40' y='352' width='560' height='40' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='56' y='378' font-size='14.5' font-weight='800' fill='#2B1D14'>NumPy + rules</text><text x='210' y='378' font-size='13.5' fill='#5B4A3D'>per-field series, crop classes, peer alerts</text>
<rect x='40' y='404' width='560' height='34' rx='9' fill='#2E7D4F'/><text x='320' y='426' font-size='14' font-weight='800' fill='#fff' text-anchor='middle'>fields.geojson + timeseries.json (static files)</text>
<path d='M600 421 H676' stroke='#2E7D4F' stroke-width='2.4' marker-end='url(#g)'/>
<rect x='680' y='20' width='480' height='430' rx='14' fill='#FFFFFF' stroke='#1F6FB2' stroke-width='1.8'/>
<text x='700' y='52' font-size='17' font-weight='800' fill='#1F6FB2'>BROWSER · STATIC WEBGIS</text>
<text x='700' y='74' font-size='13' fill='#5B4A3D'>No server at runtime: static files + public tiles</text>
<rect x='700' y='92' width='440' height='48' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='716' y='113' font-size='14.5' font-weight='800' fill='#2B1D14'>Static files</text><text x='716' y='131' font-size='13' fill='#5B4A3D'>fields + time series load instantly</text>
<rect x='700' y='154' width='440' height='48' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='716' y='175' font-size='14.5' font-weight='800' fill='#2B1D14'>Planetary Computer tiles</text><text x='716' y='193' font-size='13' fill='#5B4A3D'>live NDVI / EVI / true colour, any date</text>
<rect x='700' y='216' width='440' height='48' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='716' y='237' font-size='14.5' font-weight='800' fill='#2B1D14'>MapLibre GL JS</text><text x='716' y='255' font-size='13' fill='#5B4A3D'>fields by crop, anomaly outlines</text>
<rect x='700' y='278' width='440' height='48' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='716' y='299' font-size='14.5' font-weight='800' fill='#2B1D14'>Chart.js</text><text x='716' y='317' font-size='13' fill='#5B4A3D'>field and regional NDVI/EVI series</text>
<rect x='700' y='340' width='440' height='48' rx='9' fill='#FBF7F2' stroke='#CDBFAF'/>
<text x='716' y='361' font-size='14.5' font-weight='800' fill='#2B1D14'>Material UI</text><text x='716' y='379' font-size='13' fill='#5B4A3D'>time slider, filters, alert list</text>
</svg>